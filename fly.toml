app = "my-rag-backend"
primary_region = "sin"

[build]

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8080"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0
  processes            = ["api"]

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
  processes = ["api"]

[mounts]
  source      = "uploads_data"
  destination = "/app/uploads"