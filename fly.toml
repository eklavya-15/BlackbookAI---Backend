# fly.toml app configuration file generated for blackbookai-backend on 2026-05-31T20:49:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blackbookai-backend'
primary_region = 'sin'

[build]

[processes]
  api = 'uvicorn app.main:app --host 0.0.0.0 --port 8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['api']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['api']
